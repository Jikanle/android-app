name: Android Release

# Manual dispatch only. Produces two artifacts from one signed build:
#   - .aab  -> uploaded by hand to Play Console (internal testing track)
#   - .apk  -> attached to a GitHub Release so testers on the pre-Play track
#              (Obtainium / direct download) get the update on their phones
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to testers (e.g. 0.2.0)"
        required: true
        default: "0.1.0"
      publish_release:
        description: "Attach the APK to a GitHub Release"
        type: boolean
        required: false
        default: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without these, `base64 --decode` of an empty secret still exits 0, Gradle
      # silently drops the signing config, and assembleRelease emits
      # app-release-unsigned.apk — which Android refuses to install. Fail here
      # instead of shipping an uninstallable artifact to testers.
      - name: Require signing secrets
        run: |
          missing=""
          [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ] || missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -n "${{ secrets.SIGNING_KEY_ALIAS }}" ]       || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "${{ secrets.SIGNING_KEY_PASSWORD }}" ]    || missing="$missing SIGNING_KEY_PASSWORD"
          [ -n "${{ secrets.SIGNING_STORE_PASSWORD }}" ]  || missing="$missing SIGNING_STORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/play-store-launch.md"
            exit 1
          fi

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Write CI local.properties
        run: |
          {
            echo "supabase.url=${{ secrets.SUPABASE_URL }}"
            echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "google.oauth.client_id=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
          } > local.properties

      - name: Build signed bundle and APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          # run_number is monotonic, so each dispatch outranks the build already
          # installed on a tester's phone.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      # Belt and braces: prove the APK that reaches testers is actually signed.
      - name: Reject unsigned APK
        run: |
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::assembleRelease produced an unsigned APK; signing config did not apply"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: jikanle-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jikanle-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with the APK
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version_name }}" \
            app/build/outputs/apk/release/*.apk \
            --title "Jikanle ${{ inputs.version_name }}" \
            --notes "Build ${{ github.run_number }} from ${{ github.sha }}." \
            --latest
