name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test offline research and event contracts
        run: deno test tools/events tools/research supabase/functions/translate-song/translate_test.ts
      - name: Check offline operator commands
        run: deno check tools/events/preview.ts tools/events/import-attendance.ts tools/research/run-study.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated SQL test engine
        run: npm install --prefix "$RUNNER_TEMP/sql-tests" --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Test SQL permissions and withdrawal in disposable Postgres
        run: PGLITE_MODULE="$RUNNER_TEMP/sql-tests/node_modules/@electric-sql/pglite/dist/index.js" node --test tools/events/check-database.mjs
      - name: Install audio inspection tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test local audio intake with synthetic WAV
        run: python3 -m unittest discover -s tools/research -p 'test_*.py'
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
