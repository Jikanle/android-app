name: Bug
description: Report a reproducible Android issue
title: "fix: "
labels: ["android"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke and who is affected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Include device, Android version, and app build when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
